name: WinUI shell
# Builds and smoke-checks the WinUI 3 front end while it is built beside the WPF app. It is not packaged or released,
# and this workflow never gates the Windows build.
on:
  pull_request:
    paths:
      - 'src/DeadWare.WinUI/**'
      - 'src/DeadWare.Services/**'
      - 'src/DeadWare.Core/**'
      - 'src/DeadWare.UpdateCore/**'
      - '.github/workflows/winui.yml'
  push:
    branches: [main]
    paths:
      - 'src/DeadWare.WinUI/**'
      - 'src/DeadWare.Services/**'
      - 'src/DeadWare.Core/**'
      - 'src/DeadWare.UpdateCore/**'
      - '.github/workflows/winui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: winui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.402'
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/DeadWare.WinUI/DeadWare.WinUI.csproj -c Release -r win-x64 --self-contained true -o artifacts/winui/DeadWare.WinUI --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path artifacts/winui/DeadWare.WinUI -DestinationPath artifacts/winui/DeadWare.WinUI.zip -CompressionLevel Optimal -Force
          $folder = (Get-ChildItem artifacts/winui/DeadWare.WinUI -File -Recurse | Measure-Object Length -Sum).Sum
          $zip = (Get-Item artifacts/winui/DeadWare.WinUI.zip).Length
          "Published size: $folder bytes folder, $zip bytes ZIP" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Smoke check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path artifacts/winui/DeadWare.WinUI/DeadWare.WinUI.exe
          $errorFile = Join-Path (Resolve-Path artifacts/winui) 'error.txt'
          Add-Type -Namespace Native -Name User32 -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr window, uint message, IntPtr w, IntPtr l);
          [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr window);
          '@
          function Start-Shell([string[]]$Extra) {
            Remove-Item -LiteralPath $errorFile, "$errorFile.status" -ErrorAction SilentlyContinue
            Start-Process -FilePath $exe -ArgumentList (@('--error-file', "`"$errorFile`"") + $Extra) -PassThru
          }
          function Assert-NoErrorFile { if (Test-Path -LiteralPath $errorFile) { throw "The shell wrote an error file: $(Get-Content -LiteralPath $errorFile -Raw)" } }

          # 1. It starts on the real monitoring services, shows the dashboard, and close hides it to the tray.
          $process = Start-Shell @()
          try {
            $deadline = (Get-Date).AddSeconds(90)
            while ($true) {
              Assert-NoErrorFile
              if ($process.HasExited) { throw "The shell exited with code $($process.ExitCode) before showing a window." }
              $process.Refresh()
              if ($process.MainWindowTitle -eq 'DeadWare') { break }
              if ((Get-Date) -gt $deadline) { throw "No window titled 'DeadWare' within 90 s (last title: '$($process.MainWindowTitle)')." }
              Start-Sleep -Milliseconds 200
            }
            'The dashboard window opened.'
            $window = $process.MainWindowHandle
            [Native.User32]::PostMessage($window, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "The shell exited (code $($process.ExitCode)) on close instead of hiding to the tray." }
            if ([Native.User32]::IsWindowVisible($window)) { throw 'The window is still visible after close.' }
            Assert-NoErrorFile
            'Close hid the window and the process kept running.'
          } finally { if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit(15000) | Out-Null } }

          # 2. With the solid fallback: readings arrive, the charts draw, and the ordinary quit path stops everything and exits 0.
          $process = Start-Shell @('--no-mica', '--exit-after', '15')
          try {
            if (-not $process.WaitForExit(90000)) { throw 'The shell did not quit within 90 s of --exit-after 15.' }
            Assert-NoErrorFile
            if ($process.ExitCode -ne 0) { throw "The shell quit with exit code $($process.ExitCode)." }
            $status = Get-Content -LiteralPath "$errorFile.status" -Raw
            "Status at quit: $status"
            if ($status -notmatch '^readings=(\d+) frames=(\d+) rows=(\d+)$') { throw "Unexpected status: $status" }
            if ([int]$Matches[1] -lt 1) { throw "The session never held a reading ($status)." }
            if ([int]$Matches[2] -lt 5) { throw "The five Overview charts did not all draw ($status)." }
          } finally { if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit(15000) | Out-Null } }

          # 3. The ported pages open and quit cleanly on the real collector, and Sensors fills its table. Process monitoring is off
          #    by default and Network needs per-app capture, so those two tables may be empty on a fresh runner.
          foreach ($page in 'sensors', 'processes', 'network', 'storage', 'battery') {
            $process = Start-Shell @('--page', $page, '--exit-after', '15')
            try {
              if (-not $process.WaitForExit(90000)) { throw "The shell did not quit within 90 s of --page $page --exit-after 15." }
              Assert-NoErrorFile
              if ($process.ExitCode -ne 0) { throw "The shell quit with exit code $($process.ExitCode) on $page." }
              $status = Get-Content -LiteralPath "$errorFile.status" -Raw
              "Status at quit on ${page}: $status"
              if ($page -eq 'sensors' -and ($status -notmatch 'rows=(\d+)$' -or [int]$Matches[1] -lt 1)) { throw "The Sensors table bound no rows ($status)." }
            } finally { if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit(15000) | Out-Null } }
          }

          # 4. Storage crashed once in three runs with a stowed XAML exception (0xC000027B). Open it repeatedly so an
          #    intermittent crash shows up here, with the event-log details printed by the next step.
          foreach ($attempt in 1..10) {
            $process = Start-Shell @('--page', 'storage', '--exit-after', '8')
            try {
              if (-not $process.WaitForExit(90000)) { throw "Storage attempt ${attempt}: the shell did not quit within 90 s." }
              Assert-NoErrorFile
              if ($process.ExitCode -ne 0) { throw "Storage attempt ${attempt}: the shell quit with exit code $($process.ExitCode) (0x$('{0:X8}' -f $process.ExitCode))." }
              "Storage attempt ${attempt}: clean quit."
            } finally { if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit(15000) | Out-Null } }
          }
          if (Get-Process -Name DeadWare.WinUI -ErrorAction SilentlyContinue) { throw 'A shell process is still running after the checks.' }
      - name: Crash details
        if: failure()
        shell: pwsh
        # A crash below the managed layer (a XAML or graphics failure) leaves no error file, only an exit code. Windows
        # records the faulting module and, for .NET, the exception and stack in the Application event log.
        run: |
          $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'DeadWare\.WinUI' } | Select-Object -First 8
          if (-not $events) { 'No Application event log entries mention DeadWare.WinUI.' }
          foreach ($event in $events) { "--- $($event.TimeCreated.ToString('HH:mm:ss')) $($event.ProviderName) event $($event.Id)"; $event.Message }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DeadWare.WinUI-win-x64
          path: artifacts/winui/DeadWare.WinUI/
          if-no-files-found: error
          retention-days: 14
