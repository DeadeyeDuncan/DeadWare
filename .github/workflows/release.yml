name: Prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.402'
      - name: Build, test and package tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw 'Invalid version tag' }
          ./scripts/publish.ps1 -Version $Matches[1]
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem artifacts/DeadWare-*-win-x64.zip* | Select-Object -ExpandProperty FullName
          $notes = Join-Path 'docs/releases' ($env:RELEASE_TAG + '.md')
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw 'Version-specific release notes are missing.' }
          gh release create $env:RELEASE_TAG @files --verify-tag --prerelease --title "DeadWare $env:RELEASE_TAG" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
