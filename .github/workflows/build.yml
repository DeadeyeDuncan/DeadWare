name: Windows build
on:
  push:
    branches: [main, Dev, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.402'
      - name: Build, test and package
        shell: pwsh
        # The real-Windows measurement classes run in the measure job below, on their own clock.
        run: ./scripts/publish.ps1 -TestFilter 'FullyQualifiedName!~MeasurementTests'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DeadWare-win-x64
          path: |
            artifacts/DeadWare-*-win-x64.zip
            artifacts/DeadWare-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: DeadWare-checks
          path: artifacts/measurements/
          if-no-files-found: warn
      - name: Print check records
        if: always()
        shell: pwsh
        # The real-Windows checks (GPU counters, End task) write these files; a run that never reached them has none.
        run: |
          if (Test-Path -LiteralPath artifacts/measurements) {
            Get-ChildItem -LiteralPath artifacts/measurements -Filter *.json | ForEach-Object { "### $($_.Name)"; Get-Content -LiteralPath $_.FullName -Raw }
          } else { 'No check records were written.' }
      - name: Render previews
        shell: pwsh
        # pwsh reports only the last command's exit code, so check each render or an earlier failure is masked.
        run: |
          dotnet run --project tools/OverviewPreview -c Release -- --render artifacts/preview-overview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/OverviewPreview -c Release -- --render-shell artifacts/preview-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: DeadWare-previews
          path: artifacts/preview-*/
          if-no-files-found: error
          retention-days: 14
  measure:
    # The real-Windows measurements (the *MeasurementTests classes) fill 256 MiB files and time 240 scans; they get their own clock.
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.402'
      - name: Run the measurements
        shell: pwsh
        run: dotnet test tests/DeadWare.App.Tests -c Release --nologo --filter 'FullyQualifiedName~MeasurementTests'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: DeadWare-measurements
          path: artifacts/measurements/
          if-no-files-found: warn
      - name: Print measurements
        if: always()
        shell: pwsh
        # The measurement tests write these files; a run that never reached them has none.
        run: |
          if (Test-Path -LiteralPath artifacts/measurements) {
            Get-ChildItem -LiteralPath artifacts/measurements -Filter *.json | ForEach-Object { "### $($_.Name)"; Get-Content -LiteralPath $_.FullName -Raw }
          } else { 'No measurements were written.' }
